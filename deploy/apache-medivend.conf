<VirtualHost *:80>
    ServerName medivend.local
    DocumentRoot /srv/medivend
    SetEnv MEDIVEND_ENV_FILE /etc/medivend/medivend.env
    <Directory /srv/medivend>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>
    <DirectoryMatch "^/srv/medivend/(config|includes|database|scripts|tests|deploy|docs|\.git)(/|$)">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    ErrorLog ${APACHE_LOG_DIR}/medivend-error.log
    CustomLog ${APACHE_LOG_DIR}/medivend-access.log combined
</VirtualHost>
